<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <rect width="192" height="192" rx="24" fill="#0F172A"/>
  <rect x="6" y="6" width="180" height="180" rx="20" fill="none" stroke="#334155" stroke-width="2"/>
  
  <g transform="translate(40, 36)">
    <!-- Top Pediment / Roof -->
    <polygon points="56,8 108,38 4,38" fill="#FFFFFF"/>
    <!-- Central Voice Beacon / Signal -->
    <circle cx="56" cy="30" r="6" fill="#38BDF8"/>

    <!-- Architrave Beam -->
    <rect x="0" y="40" width="112" height="7" rx="1" fill="#FFFFFF"/>

    <!-- Columns (4 Pillars) -->
    <rect x="8" y="50" width="14" height="50" rx="2" fill="#FFFFFF"/>
    <rect x="36" y="50" width="14" height="50" rx="2" fill="#FFFFFF"/>
    <rect x="62" y="50" width="14" height="50" rx="2" fill="#FFFFFF"/>
    <rect x="90" y="50" width="14" height="50" rx="2" fill="#FFFFFF"/>

    <!-- Base Plinth -->
    <rect x="4" y="103" width="104" height="6" rx="1" fill="#94A3B8"/>
    <rect x="0" y="111" width="112" height="9" rx="2" fill="#FFFFFF"/>

    <!-- Civic Voice Broadcast Waves -->
    <path d="M42,7 C46,3 51,1 56,1 C61,1 66,3 70,7" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M35,2 C41,-4 48,-7 56,-7 C64,-7 71,-4 77,2" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
