<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="64" fill="#0F172A"/>
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="52" fill="none" stroke="#334155" stroke-width="4"/>
  
  <!-- Civic Voice Emblem -->
  <g transform="translate(106, 96)">
    <!-- Top Pediment / Roof -->
    <polygon points="150,20 290,100 10,100" fill="#FFFFFF"/>
    <!-- Pediment Arch Trim -->
    <polygon points="150,44 265,100 35,100" fill="#0F172A"/>
    <!-- Central Voice Beacon / Signal -->
    <circle cx="150" cy="80" r="16" fill="#38BDF8"/>

    <!-- Architrave Beam -->
    <rect x="0" y="106" width="300" height="18" rx="2" fill="#FFFFFF"/>

    <!-- Columns (4 Classical Pillars) -->
    <rect x="24" y="132" width="36" height="130" rx="4" fill="#FFFFFF"/>
    <rect x="30" y="138" width="8" height="118" fill="#E2E8F0" opacity="0.6"/>

    <rect x="96" y="132" width="36" height="130" rx="4" fill="#FFFFFF"/>
    <rect x="102" y="138" width="8" height="118" fill="#E2E8F0" opacity="0.6"/>

    <rect x="168" y="132" width="36" height="130" rx="4" fill="#FFFFFF"/>
    <rect x="174" y="138" width="8" height="118" fill="#E2E8F0" opacity="0.6"/>

    <rect x="240" y="132" width="36" height="130" rx="4" fill="#FFFFFF"/>
    <rect x="246" y="138" width="8" height="118" fill="#E2E8F0" opacity="0.6"/>

    <!-- Base Plinth (Steps) -->
    <rect x="8" y="270" width="284" height="16" rx="2" fill="#94A3B8"/>
    <rect x="0" y="292" width="300" height="22" rx="4" fill="#FFFFFF"/>

    <!-- Civic Voice Broadcast Waves (Top Beacon Signal) -->
    <path d="M120,4 M150,-10 L150,6" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <path d="M110,18 C122,8 135,2 150,2 C165,2 178,8 190,18" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <path d="M92,4 C109,-10 128,-18 150,-18 C172,-18 191,-10 208,4" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
